[tool.poetry]
name = "microblog"
version = "0.1.0"
description = "Proyecto Microblog para Ingeniería de Software II"
authors = ["Cruz Ponce <tu_correo@ejemplo.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14.7"
flask = "^3.0.0"
python-dotenv = "^1.0.0"
flask-sqlalchemy = "^3.1.1"
flask-migrate = "^4.1.0"
flask-login = "^0.6.3"
flask-wtf = "^1.3.0"
flask-mail = "^0.10.0"
flask-babel = "^4.0.0"
flask-moment = "^1.0.6"
email-validator = "^2.3.0"
pyjwt = "^2.15.1"
elasticsearch = "^9.5.1"
redis = "^8.1.0"
rq = "^2.12.0"
flask-httpauth = "^4.8.1"
langdetect = "^1.0.9"
requests = "^2.34.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "coverage (>=7.17.0,<8.0.0)"
]
